name: Deploy

# Só manual: Actions → Deploy → Run workflow. Hoje a publicação é feita do computador
# (npm run deploy:production) e o ambiente de staging ainda não existe. Para rodar por aqui,
# cadastre os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID no repositório.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TARGET: ${{ inputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Migrations do D1
        working-directory: apps/platform
        run: npx wrangler d1 migrations apply DB --config wrangler.jsonc --env "$TARGET" --remote
      - name: Build e deploy
        working-directory: apps/platform
        run: npx vite build --mode "$TARGET" && npx wrangler deploy
