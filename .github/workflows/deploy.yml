name: Deploy

# push na main → staging. Produção: Actions → Deploy → Run workflow → production.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TARGET: ${{ github.event.inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Migrations do D1
        working-directory: apps/platform
        run: npx wrangler d1 migrations apply DB --config wrangler.jsonc --env "$TARGET" --remote
      - name: Build e deploy
        working-directory: apps/platform
        run: npx vite build --mode "$TARGET" && npx wrangler deploy
