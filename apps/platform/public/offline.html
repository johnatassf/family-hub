<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#101923" />
    <title>Sem conexão · Família</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b111a;
        color: #e7eaf0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      .card {
        max-width: 360px;
        border: 1px solid #263747;
        background: #141f2b;
        border-radius: 16px;
        padding: 28px 24px;
      }
      .logo {
        color: #61d59b;
        font-size: 20px;
        margin-bottom: 16px;
      }
      p {
        color: #8d9aab;
        font-size: 14px;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 8px;
        background: #61d59b;
        color: #10251c;
        font-weight: 600;
        text-decoration: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">◈ <b>Família</b></div>
      <h1 style="font-size: 18px; margin: 0 0 8px">Sem conexão com a internet</h1>
      <p>Os dados ficam só no servidor, por segurança. Assim que a internet voltar, é só tentar de novo.</p>
      <a href="/">Tentar de novo</a>
    </div>
  </body>
</html>
